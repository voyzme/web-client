name: Webapp Release

on:
    push:
        branches:
            - feature/deployment-scripts
    release:
        types: [published]
        branches:
            - vd-development

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}

            - name: Create certificates directory
              run: |
                  mkdir -p certificates

            - name: Write SSL certificates
              run: |
                  echo "${{ secrets.SSL_CA_BUNDLE }}" > certificates/ca_bundle.crt
                  echo "${{ secrets.SSL_CERTIFICATE }}" > certificates/certificate.crt
                  echo "${{ secrets.SSL_PRIVATE_KEY }}" > certificates/private.key

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile.webapp
                  push: true
                  tags: |
                      ghcr.io/francescognn/web-client/voicedrop-web:${{ github.ref_name }}
                  cache-from: type=registry,ref=ghcr.io/francescognn/web-client/voicedrop-web:latest
                  cache-to: type=inline
